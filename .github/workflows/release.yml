name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      # macOS signing/notarization is INERT by default and self-enabling.
      #
      # The Apple vars must be *absent* from the environment — not merely empty —
      # when no secrets are configured. Passing e.g. `APPLE_CERTIFICATE: ${{ ... }}`
      # directly on the build step sets it to an empty string when the secret is
      # missing, and that empty-but-*present* value makes tauri-bundler take the
      # "import this certificate" path: it runs `security import` on an empty cert
      # and the whole macOS build fails with
      #   "failed codesign application: failed to run command security import:
      #    failed to import keychain certificate".
      # (tauri-action's own JS check treats empty as falsy and skips, but the Rust
      #  bundler underneath treats the var as present — hence the trap.)
      #
      # So we forward the vars through $GITHUB_ENV from a script step that only
      # emits them when APPLE_CERTIFICATE is non-empty. No secrets → nothing emitted
      # → APPLE_CERTIFICATE stays unset → tauri-bundler does a clean ad-hoc sign
      # (signingIdentity "-" from tauri.conf.json), un-notarized — exactly today's
      # intended build. Add the secrets (see docs/INSTALL_MACOS.md) and the same
      # workflow produces a Developer-ID-signed, notarized, stapled build with no
      # further changes. macOS-only; the Windows build is untouched.
      - name: Configure Apple code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret set — building ad-hoc-signed (signingIdentity '-'), un-notarized."
            exit 0
          fi
          echo "APPLE_CERTIFICATE present — enabling Developer-ID signing + notarization."
          # Multiline-safe write to $GITHUB_ENV (handles base64 cert line-wrapping).
          emit() { printf '%s<<__FLINT_ENV_EOF__\n%s\n__FLINT_ENV_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          emit APPLE_CERTIFICATE          "$APPLE_CERTIFICATE"
          emit APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          emit KEYCHAIN_PASSWORD          "$KEYCHAIN_PASSWORD"
          emit APPLE_ID                   "$APPLE_ID"
          emit APPLE_PASSWORD             "$APPLE_PASSWORD"
          emit APPLE_TEAM_ID              "$APPLE_TEAM_ID"
          # Use the supplied Developer-ID identity; fall back to ad-hoc "-" if unset.
          emit APPLE_SIGNING_IDENTITY     "${APPLE_SIGNING_IDENTITY:--}"

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Apple signing/notarization vars (if any) are injected via $GITHUB_ENV by
          # the "Configure Apple code signing" step above — intentionally absent here
          # so they are never set to empty strings. See that step's comment block.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Rename bundles (strip version from filename)
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          # tr -d '\r' — Git Bash on Windows appends CR to each line of jq output,
          #   which breaks `cp "$f"` with a "no such file" error on the phantom \r suffix.
          # [ -d "$f" ] — tauri-action emits the .app bundle directory alongside each .dmg;
          #   only file bundles (.msi, .exe, .dmg) should make it to the draft release.
          # CI-BUILD-6: guard against two bundles stripping to the same name
          # (a silent cp overwrite would drop an asset from the release).
          declare -A seen
          echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]' | tr -d '\r' | while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -d "$f" ] && continue
            base=$(basename "$f")
            newbase=${base//_${VERSION}_/_}
            if [ -n "${seen[$newbase]:-}" ]; then
              echo "ERROR: '$base' and '${seen[$newbase]}' both map to '$newbase'" >&2
              exit 1
            fi
            seen[$newbase]="$base"
            cp "$f" "release-assets/$newbase"
            echo "  $base -> $newbase"
          done
          ls -la release-assets/

      - name: Publish to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flint ${{ github.ref_name }}"
          body: |
            See the [CHANGELOG](https://github.com/techlogist1/flint/blob/master/CHANGELOG.md) for full release notes.

            ### Install
            - **Windows** — run the `.msi` or `.exe`. If SmartScreen warns: **More info → Run anyway**.
            - **macOS** — the build is not notarized, so Gatekeeper blocks it on first launch. Clear the download quarantine:
              ```sh
              xattr -dr com.apple.quarantine /Applications/Flint.app
              ```
              or right-click **Flint.app → Open**, then **System Settings → Privacy & Security → Open Anyway**. Full details: [docs/INSTALL_MACOS.md](https://github.com/techlogist1/flint/blob/master/docs/INSTALL_MACOS.md).
          draft: true
          prerelease: false
          files: release-assets/*
